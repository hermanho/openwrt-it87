name: Build and publish IT8613 APK feed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: it87-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: 25.12.2-x86-64
  FEED_TAG: feed
  APK_TOOLS_REF: b5a31c0d865342ad80be10d68f1bb3d3ad9b0866

jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SDK prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            swig unzip zlib1g-dev file wget zstd jq
      - uses: actions/cache/restore@v5
        id: sdk-cache
        with:
          path: .work/downloads
          key: it87-sdk-${{ runner.os }}-${{ hashFiles('targets/*.json') }}
      - name: Build APK with exact SDK and verify metadata
        run: bash scripts/build.sh "$TARGET"
      - name: Validate downloaded SDK for caching
        if: always() && steps.sdk-cache.outputs.cache-hit != 'true'
        id: sdk-download
        run: |
          archive=".work/downloads/$(jq -r .sdk targets/"$TARGET".json)"
          if [ -f "$archive" ]; then
            printf '%s  %s\n' "$(jq -r .sdk_sha256 targets/"$TARGET".json)" "$archive" | sha256sum -c -
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v5
        if: always() && steps.sdk-download.outputs.valid == 'true'
        with:
          path: .work/downloads
          key: it87-sdk-${{ runner.os }}-${{ hashFiles('targets/*.json') }}
      - name: Checkout pinned APK tools
        uses: actions/checkout@v6
        with:
          repository: alpinelinux/apk-tools
          ref: ${{ env.APK_TOOLS_REF }}
          path: .work/apk-tools
      - name: Build APK signing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libssl-dev lua5.1 liblua5.1-0-dev meson ninja-build
          meson setup .work/apk-tools/build .work/apk-tools \
            -Db_lto=true -Dcompressed-help=false -Ddocs=disabled -Dhelp=enabled \
            -Dlua_version=5.1 -Ddefault_library=static -Durl_backend=wget \
            -Dzstd=false -Dpython=disabled -Dtests=disabled -Dcrypto_backend=openssl
          ninja -C .work/apk-tools/build
          sudo meson install -C .work/apk-tools/build --strip
      - name: Include APK signing tool in build bundle
        run: cp /usr/local/bin/apk dist/"$TARGET"/apk
      - name: Upload APK, module and build metadata
        uses: actions/upload-artifact@v7
        with:
          name: it87-${{ env.TARGET }}-${{ github.sha }}
          path: dist/${{ env.TARGET }}/
          if-no-files-found: error

  publish:
    name: Sign and publish feed
    environment: feed-production
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Require shared signing key
        env:
          APK_SIGNING_KEY_PEM: ${{ secrets.APK_SIGNING_KEY_PEM }}
        run: |
          test -n "$APK_SIGNING_KEY_PEM" || {
            echo '::error::Set APK_SIGNING_KEY_PEM in the feed-production Environment to the existing HomeProxy signing key.'
            exit 1
          }
          test -s keys/openwrt-it87.pem
      - uses: actions/download-artifact@v8
        with:
          name: it87-${{ env.TARGET }}-${{ github.sha }}
          path: dist/${{ env.TARGET }}/
      - name: Enable APK signing tool from build bundle
        run: |
          chmod 0755 dist/"$TARGET"/apk
          echo "$GITHUB_WORKSPACE/dist/$TARGET" >> "$GITHUB_PATH"
      - name: Restore prior APKs and assemble feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/feed .work/retained
          if gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$FEED_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern '*.apk' --dir .work/retained
            cp .work/retained/*.apk dist/feed/
          fi
          cp dist/"$TARGET"/*.apk dist/feed/
      - name: Sign and verify APK repository
        env:
          APK_SIGNING_KEY_PEM: ${{ secrets.APK_SIGNING_KEY_PEM }}
        run: bash scripts/sign-feed.sh dist/feed
      - name: Publish stable feed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'IT8613 signed APK feed' --latest=false \
              --notes 'Signed APK repository. See README for supported kernel ABI, installation and rollback.'
          fi
          gh release upload "$FEED_TAG" --repo "$GITHUB_REPOSITORY" dist/feed/* --clobber
      - name: Upload signed feed artifact
        uses: actions/upload-artifact@v7
        with:
          name: signed-it87-feed-${{ github.sha }}
          path: dist/feed/
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/feed/

  deploy:
    name: Deploy GitHub Pages feed
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
